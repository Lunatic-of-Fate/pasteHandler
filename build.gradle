plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id("io.spring.dependency-management") version "1.1.7"
}

group = 'org.lunatic'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql:42.5.0'

    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.780'
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.kafka:spring-kafka:3.3.2'

}

test {
    useJUnitPlatform()
}
bootJar {
    archiveClassifier = '' // Убирает суффикс "-plain"
    mainClass = 'org.lunatic.Main' // Укажите ваш main-класс
}