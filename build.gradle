plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id("io.spring.dependency-management") version "1.1.7"
}

group = 'org.lunatic'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.postgresql:postgresql:42.5.0'
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.780'
    implementation 'org.modelmapper:modelmapper:2.4.4'
    implementation "software.amazon.awssdk:s3:2.25.1"

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springframework.kafka:spring-kafka:3.3.2'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'info.solidsoft.mockito:mockito-java8:2.5.0'
}

test {
    useJUnitPlatform()
}
bootJar {
    archiveClassifier = '' // Убирает суффикс "-plain"
    mainClass = 'org.lunatic.Main' // Укажите ваш main-класс
}

tasks.register('buildDocker', Exec) {
    dependsOn 'bootJar'
    commandLine 'docker', 'build', '-t', 'paste-handler:latest', '.'
}

tasks.register('runDocker', Exec) {
    dependsOn 'buildDocker'
    commandLine 'docker', 'run', '-d', '--name',
            'paste-handler', '--network', 'my-network', '-p', '8081:8080',
            '--env-file', './src/main/resources/.env',
            'paste-handler'
}